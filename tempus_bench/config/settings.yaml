file_logging: true
console_logging: true
tensorboard_logging: true
console_log_level: INFO
file_log_level: DEBUG
conda_env_prefix: "benchmark"
reinstall_conda: false
verbose: false

# R2 Cloud Storage (S3-compatible) - disabled by default
# Set r2_enabled to true and provide credentials to stream results to R2
r2_enabled: false
r2_bucket: ""
r2_endpoint_url: ""
r2_access_key_id: ""
r2_secret_access_key: ""
r2_prefix: "tempusbench"
